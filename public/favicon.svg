<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b0e14" />
  <polygon points="50,15 85,35 85,65 50,85 15,65 15,35" stroke="url(#grad)" stroke-width="3" fill="none" opacity="0.6" />
  <text x="50" y="62" font-family="'Outfit', sans-serif" font-weight="900" font-size="42" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">R</text>
</svg>
